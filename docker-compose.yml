services:
  db:
    image: postgres:17
    container_name: garage-db
    restart: always
    env_file:
      - apps/api/.env
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: garage-api
    restart: always
    env_file:
      - apps/api/.env
    ports:
      - '4000:4000'
    depends_on:
      - db

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: grg-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '8082:80'
    depends_on:
      - db

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    container_name: garage-web
    restart: always
    env_file:
      - apps/web/.env
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  db_data:
